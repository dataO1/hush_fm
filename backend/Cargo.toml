[package]
name = "hushfm-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# HTTP server
axum-server = "0.7"

# WebSockets
tokio-tungstenite = "0.24"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WebRTC
mediasoup = "0.20"
mediasoup-types = "0.2"


# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "uuid"] }
utoipa-axum = "0.1"
utoipa-swagger-ui = { version = "8", features = ["axum", "vendored"] }

# AsyncAPI
schemars = { version = "0.8", features = ["uuid1"] }
serde_yaml = "0.9"

# Serde extensions for custom serialization
serde_with = { version = "3", features = ["schemars_0_8"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
hex = "0.4"
thiserror = "1"


# Enhanced state management
arc-swap = "1"
once_cell = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }

# Audio processing
cpal = "0.17"                    # Audio device capture
audiopus = "0.3.0-rc.0"         # Opus codec bindings (prerelease)
ringbuf = "0.3"                 # Lock-free SPSC ring buffer
bytes = "1"                     # For RTP packet manipulation

[dev-dependencies]
tokio-test = "0.4"


[profile.release]
# Maximize runtime speed
opt-level = 3

# "Fat" LTO allows the compiler to optimize across all crate boundaries.
# This provides the biggest performance boost by enabling cross-crate inlining.
# Your 8GB RAM can easily handle this.
lto = "fat"

# maximize optimization opportunities by giving LLVM the whole crate at once.
# This makes builds slower but runtime faster.
codegen-units = 1

# Keep unwinding for better error reporting/stability.
# Only use "abort" if you absolutely don't care about clean shutdowns on panic.
# Unwinding is slightly slower on panic, but has negligible impact on normal execution.
panic = "unwind"

# CPU-specific instructions (Critical for Pi 4)
# You can't set this in Cargo.toml directly, see RUSTFLAGS below.
