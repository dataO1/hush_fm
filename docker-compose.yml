version: '3.8'

services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: hushfm-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # HTTP collector
      - "6831:6831/udp"  # UDP collector (agent)
      - "6832:6832/udp"  # UDP collector (agent)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_ENABLED=false
    networks:
      - hushfm-tracing
    restart: unless-stopped

networks:
  hushfm-tracing:
    driver: bridge